services:
  postgres:
    image: postgres:16
    container_name: aws_elt_postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: elt_user
      POSTGRES_PASSWORD: elt_password
      POSTGRES_DB: elt_db

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: